name: unci-maka-py
channels:
  - conda-forge
dependencies:
  - python=3.12
  - jupyterlab
  - ipykernel       # register env as Jupyter kernel in CyVerse
  - numpy
  - pandas
  - matplotlib
  - seaborn
  - geopandas       # pulls in shapely, pyproj, fiona
  - rioxarray       # pulls in affine, xarray
  - rasterio        # pulls in gdal
  - gdal            # explicitly imported as osgeo.gdal
  - xarray
  - dask            # lazy loading backend for earthaccess/rioxarray
  - folium
  - holoviews
  - hvplot          # pulls in bokeh
  - earthaccess     # pulls in requests, fsspec, aiohttp
  - scipy           # spatial operations (label, binary_fill_holes)
  - pynhd           # NHDPlus flowlines via NLDI + VAA (drainage area)
  - py3dep          # USGS 3DEP DEM access (small AOIs only; 01a uses static S3 tiles)
  - whitebox        # WhiteboxTools — hydrology engine for VBET (noarch wrapper;
                    # downloads its ~200 MB Rust binary on first use, see 01a)
  - pysheds         # legacy hydrology backend — kept until the WBT path is validated
  - pip
  - pip:
      - localtileserver
      - dataretrieval     # USGS NWIS discharge data (used in notebook 00)